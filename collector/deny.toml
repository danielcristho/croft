# Dependency licenses: Apache-2.0 and the CNCF third-party allowlist,
# https://github.com/cncf/foundation/blob/main/policies-guidance/allowed-third-party-license-policy.md

[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MIT-0",
    "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"
exceptions = [
    # Build-time only (proc-macro2); Unicode-3.0 is not on the CNCF allowlist and has no CNCF exception yet.
    { crate = "unicode-ident", allow = ["Unicode-3.0"] },
    # The eBPF programs: GPL-2.0 dual licensed, covered by the CNCF blanket exception of 2023-08-31.
    { crate = "collector-ebpf", allow = ["GPL-2.0-only"] },
]

[licenses.private]
ignore = false
