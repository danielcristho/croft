<text x="549.0" y="56.0">/metrics</text>
<rect x="684" y="24" width="170" height="64" rx="10" fill="#FFFFFF" stroke="#1BAF7A" stroke-width="2"/>
<text x="769.0" y="56.0">croft scale</text>
<rect x="904" y="24" width="170" height="64" rx="10" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="2"/>
<text x="989.0" y="56.0">replicas</text>
<polyline points="194,56.0 242,56.0" fill="none" stroke="#4A4A4A" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="414,56.0 462,56.0" fill="none" stroke="#4A4A4A" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="634,56.0 682,56.0" fill="none" stroke="#4A4A4A" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="854,56.0 902,56.0" fill="none" stroke="#4A4A4A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="244" y="158" width="170" height="64" rx="10" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="2"/>
