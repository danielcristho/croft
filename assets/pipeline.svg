<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1098 246" width="1098" height="246" role="img" aria-label="croft pipeline: eBPF in the kernel feeds the collector, which writes a dataset and serves /metrics; croft scale reads /metrics and sets the Deployment's replicas.">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4A4A4A"/></marker></defs>
<style>text { fill: #1F1F1F; font-family: Inter, "Helvetica Neue", Arial, sans-serif; font-size: 18px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }</style>
<rect width="1098" height="246" fill="#FFFFFF"/>
<rect x="24" y="24" width="170" height="64" rx="10" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="2"/>
<text x="109.0" y="56.0">eBPF in kernel</text>
<rect x="244" y="24" width="170" height="64" rx="10" fill="#FFFFFF" stroke="#1BAF7A" stroke-width="2"/>
<text x="329.0" y="56.0">collector</text>
