<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" role="img" aria-label="Lab cluster: k3s with one control plane that also runs pods and has a GPU, and two workers, one with a GPU; clients reach the API server; add-ons are ingress-nginx, Prometheus, metrics-server and Linkerd; every node runs kubelet, kube-proxy and an eBPF collector">
