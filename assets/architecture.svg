<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 676" width="1000" height="676" role="img" aria-label="croft architecture: inside the Linux kernel, eBPF programs and kernel files record syscall rates, bytes moved, CPU wait, connections, socket I/O, GPU use, CPU pressure and processes for your app's pods. The croft collector reads them every 2 seconds and writes a dataset, serves Prometheus and feeds croft scale, which sets the number of pods.">
<defs>
<marker id="head" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#52606D"/></marker>
<marker id="tail" markerWidth="12" markerHeight="12" refX="1" refY="5" orient="auto"><path d="M10,0 L0,5 L10,10 Z" fill="#52606D"/></marker>
<linearGradient id="g" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#128A60"/><stop offset="1" stop-color="#1BAF7A"/></linearGradient>
<linearGradient id="g2" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1BAF7A"/><stop offset="1" stop-color="#128A60"/></linearGradient>
</defs>
<style>text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }</style>
<rect width="1000" height="676" fill="#FFFFFF"/>
<rect x="24" y="24" width="186" height="62" rx="10" fill="#FFFFFF" stroke="#CBD2D9" stroke-width="2"/>
<text x="117" y="63" font-size="20" font-weight="600" text-anchor="middle" fill="#1F2933">Dataset</text>
