<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 998 246" width="998" height="246" role="img" aria-label="croft architecture: the kernel reports a web app's syscalls through eBPF to a collector on each node. The collector writes a dataset and serves metrics to Prometheus and to croft scale, which sets the number of pods.">
