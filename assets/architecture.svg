<line x1="327" y1="138" x2="327" y2="86" stroke="#52606D" stroke-width="3" marker-end="url(#head)"/>
<rect x="24" y="138" width="396" height="76" rx="12" fill="url(#g)"/>
<text x="222" y="185" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">croft collector</text>
<line x1="420" y1="176" x2="486" y2="176" stroke="#52606D" stroke-width="3" marker-end="url(#head)"/>
<rect x="486" y="138" width="190" height="76" rx="12" fill="url(#g)"/>
<text x="581" y="185" font-size="24" font-weight="700" text-anchor="middle" fill="#FFFFFF">croft scale</text>
