# Checks links in the docs: on pull requests that touch Markdown, and weekly, where a broken link opens an issue.
# Commit and compare links in CHANGELOG.md come from Release Please; GitHub answers 503 when lychee checks them all at once.
name: links

on:
  pull_request:
    paths: ["**.md", "**.mdx", ".github/workflows/links.yml"]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci && npm run build
        working-directory: website
      - id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/website/dist
            --exclude-path node_modules
            --exclude-path .venv
            --exclude '^https?://(localhost|127\.0\.0\.1|ADDR)'
            --exclude '^https://github\.com/danielcristho/croft/(commit|compare)/'
            './*.md' 'docs/**/*.md' 'agent/*.md' 'deploy/**/*.md' 'labs/**/*.md' 'website/dist/**/*.html'
          fail: ${{ github.event_name == 'pull_request' }}
      - if: github.event_name != 'pull_request' && steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: "[DOCS] broken links"
          content-filepath: ./lychee/out.md
          labels: documentation
