# Checks every pull request and main: the collector, its eBPF program, the Helm chart and the experiment harness.
# Pushes to main and version tags also publish the image to GHCR.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collector:
    runs-on: ubuntu-latest
    env:
      # The image job builds the eBPF program; bpf-linker takes minutes to install.
      AYA_BUILD_SKIP: "1"
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - run: rustup component add clippy
      - run: cargo +nightly fmt --manifest-path collector/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path collector/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path collector/Cargo.toml

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      # The cache holds the toolchain layers, so the push below reuses this build.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          tags: croft-collector:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm croft-collector:ci --version
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/croft
      - run: helm lint deploy/helm/croft -f deploy/helm/croft/ci/targets-values.yaml
      - run: helm template croft deploy/helm/croft -n croft -f deploy/helm/croft/ci/targets-values.yaml

  harness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/research/experiment
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      # Every module in tests/, so a new test file runs without a CI change.
      - run: uv run python -m unittest discover -s tests
