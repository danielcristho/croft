# Squash merges use the pull request title as the commit on main, so it follows the same rule as .githooks/commit-msg.
name: pr-title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            perf
            ci
            build
            revert
          requireScope: false
          subjectPattern: ^[a-z].{0,71}$
          subjectPatternError: |
            The description "{subject}" must start with a lowercase letter and be at most 72 characters.
