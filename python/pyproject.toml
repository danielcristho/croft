[project]
name = "croft-signals"
version = "0.6.0"
description = "croft signals for notebooks: Prometheus metrics and collector datasets as pandas frames"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Daniel Pepuho" },
    { name = "David Ochieng' Agit" },
]
keywords = ["ebpf", "kubernetes", "autoscaling", "prometheus", "pandas"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
dependencies = ["pandas>=2.2", "zstandard>=0.25"]

[project.urls]
Repository = "https://github.com/danielcristho/croft"
Documentation = "https://croft-docs.pages.dev"
Changelog = "https://github.com/danielcristho/croft/blob/main/CHANGELOG.md"

[tool.uv.build-backend]
module-name = "croft"

[project.optional-dependencies]
plot = ["matplotlib>=3.9"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
