image:
  repository: ghcr.io/danielcristho/croft
  # Empty uses the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

collector:
  logLevel: info
  # Cgroups whose processes are recorded even without a GPU.
  watchCgroups: kubepods
  metricsPort: 9464
  hostDataPath: /var/lib/croft
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 512Mi
  tolerations:
    - operator: Exists
  nodeSelector: {}
  # Needs the Prometheus Operator CRDs.
  podMonitor:
    enabled: false
    interval: 5s
    labels: {}

scaler:
  logLevel: info
  proxyImage: registry.k8s.io/kubectl:v1.36.4
  resources:
    requests:
      cpu: 20m
      memory: 16Mi
    limits:
      memory: 64Mi
  proxyResources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  targets: []