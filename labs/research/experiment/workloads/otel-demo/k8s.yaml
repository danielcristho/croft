# OpenTelemetry Demo 3.1.0 (open-telemetry/opentelemetry-demo, tag 3.1.0), generated from its compose.yaml and .env.
# Changed for the harness: one namespace, app=<name> labels, the core services only (no frontend-proxy,
# image-provider, load generator, flagd-ui or telemetry docs), a collector that drops every signal instead of
# the observability stack, memory limits of at least 64Mi, no service links, frontend probes, and an ingress
# to the frontend.
apiVersion: v1
kind: Namespace
metadata:
  name: otel-demo

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: otel-demo
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      enableServiceLinks: false
      containers:
      - name: frontend
        image: ghcr.io/open-telemetry/demo:3.1.0-frontend
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 300m
            memory: 512Mi
          limits:
            cpu: 300m
            memory: 512Mi
        env:
        - name: PORT
          value: '8080'
        - name: FRONTEND_ADDR
          value: frontend:8080
        - name: AD_ADDR
          value: ad:9555
        - name: CART_ADDR
          value: cart:7070
        - name: CHECKOUT_ADDR
          value: checkout:5050
        - name: CURRENCY_ADDR
          value: currency:7001
        - name: PRODUCT_CATALOG_ADDR
          value: product-catalog:3550
        - name: RECOMMENDATION_ADDR
          value: recommendation:9001
        - name: SHIPPING_ADDR
          value: http://shipping:50050
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector:4317
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=opentelemetry-demo,service.version=3.1.0,service.criticality=critical
        - name: ENV_PLATFORM
          value: local
        - name: OTEL_SERVICE_NAME
          value: frontend
        - name: PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
          value: http://localhost:8080/otlp-http/v1/traces
        - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
          value: cumulative
        - name: OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION
          value: explicit_bucket_histogram
        - name: WEB_OTEL_SERVICE_NAME
          value: frontend-web
        - name: OTEL_COLLECTOR_HOST
          value: otel-collector
        - name: FLAGD_HOST
          value: flagd
        - name: FLAGD_PORT
          value: '8013'
        readinessProbe:
          tcpSocket: &id001
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          tcpSocket: *id001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
          initialDelaySeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: otel-demo
spec:
  selector:
    app: frontend
  ports:
  - name: p8080
    port: 8080
    targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
