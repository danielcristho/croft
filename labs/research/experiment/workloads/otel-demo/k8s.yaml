        - containerPort: 9001
        resources:
          requests:
            cpu: 100m
            memory: 500Mi
          limits:
            cpu: '1'
            memory: 500Mi
        env:
        - name: RECOMMENDATION_PORT
          value: '9001'
        - name: PRODUCT_CATALOG_ADDR
          value: product-catalog:3550
        - name: FLAGD_HOST
          value: flagd
        - name: FLAGD_PORT
          value: '8013'
        - name: OTEL_PYTHON_LOG_CORRELATION
          value: 'true'
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector:4317
        - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
          value: cumulative
        - name: OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION
          value: explicit_bucket_histogram
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=opentelemetry-demo,service.version=3.1.0,service.criticality=medium
        - name: OTEL_SERVICE_NAME
