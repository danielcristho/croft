apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagd
  namespace: otel-demo
spec:
  selector:
    matchLabels:
      app: flagd
  template:
    metadata:
      labels:
        app: flagd
    spec:
      enableServiceLinks: false
      containers:
      - name: flagd
        image: ghcr.io/open-feature/flagd:v0.16.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8013
        - containerPort: 8016
        resources:
          requests:
            cpu: 100m
            memory: 75Mi
          limits:
            cpu: '1'
            memory: 75Mi
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector:4318
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: http/protobuf
        - name: GOMEMLIMIT
          value: 60MiB
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=opentelemetry-demo,service.version=3.1.0,service.criticality=low
        - name: OTEL_SERVICE_NAME
          value: flagd
        args:
        - start
        - --uri
        - file:./etc/flagd/demo.flagd.json
        volumeMounts:
        - name: config
          mountPath: /etc/flagd
      volumes:
      - name: config
        configMap:
          name: flagd-config

