apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: otel-demo
spec:
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      enableServiceLinks: false
      containers:
      - name: otel-collector
        image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.159.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4317
        - containerPort: 4318
        resources:
          requests:
            cpu: 100m
            memory: 400Mi
          limits:
            cpu: '1'
            memory: 400Mi
        env:
        - name: AD_PROMETHEUS_PORT
          value: '9465'
        - name: FRONTEND_PROXY_ADDR
          value: frontend-proxy:8080
        - name: HOST_FILESYSTEM
          value: /
        - name: IMAGE_PROVIDER_HOST
          value: image-provider
        - name: IMAGE_PROVIDER_PORT
          value: '8081'
        - name: OTEL_COLLECTOR_HOST
          value: otel-collector
        - name: OTEL_COLLECTOR_PORT_GRPC
          value: '4317'
        - name: OTEL_COLLECTOR_PORT_HTTP
          value: '4318'
        - name: POSTGRES_HOST
          value: astronomy-db
        - name: POSTGRES_PORT
          value: '5432'
        - name: POSTGRES_MONITORING_PASSWORD
          value: monitoring_password
        - name: GOMEMLIMIT
          value: 160MiB
        args:
        - --config=/etc/otelcol/config.yml
        volumeMounts:
        - name: config
          mountPath: /etc/otelcol
      volumes:
      - name: config
        configMap:
          name: otel-collector-config

