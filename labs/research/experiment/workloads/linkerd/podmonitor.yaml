apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: linkerd-proxy
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    any: true
  selector:
    matchExpressions:
      - key: linkerd.io/control-plane-ns
        operator: Exists
  podMetricsEndpoints:
    - port: linkerd-admin
      path: /metrics
      interval: 10s
      # The proxy does not label its own deployment; edges.csv reads it, as Linkerd's own Prometheus does.
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_linkerd_io_proxy_deployment]
          targetLabel: deployment
