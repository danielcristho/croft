apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: linkerd-proxy
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    any: true
  selector:
    matchExpressions:
      - key: linkerd.io/control-plane-ns
        operator: Exists
  podMetricsEndpoints:
    - port: linkerd-admin
      path: /metrics
      interval: 10s
