apiVersion: v1
kind: Namespace
metadata:
  name: croft-exp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: croft-exp
spec:
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp
          image: croft-webapp:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # Requests equal limits: the HPA's 70% then means 0.7 core per pod, so ten pods span the load steps.
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: webapp
  namespace: croft-exp
spec:
  selector:
    app: webapp
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webapp
  namespace: croft-exp
spec:
  ingressClassName: nginx
  rules:
    - host: web.127.0.0.1.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp
                port:
                  number: 80
