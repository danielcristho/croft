# DeathStarBench hotelReservation (Gan et al., ASPLOS 2019), from hotelReservation/kubernetes at
# delimitrou/DeathStarBench 6ecb097. Changed for the harness: one namespace, app=<name> labels, pinned
# images, MongoDB on emptyDir instead of hostPath volumes, and probes on the frontend.
# Review and attractions are left out, as upstream does; the frontend dials them lazily.
apiVersion: v1
kind: Namespace
metadata:
  name: hotel-res
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: hotel-res
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: deathstarbench/hotel-reservation:0.3.5
          imagePullPolicy: IfNotPresent
          command: [frontend]
          env:
            - name: TLS
              value: "0"
            - name: GC
              value: "100"
            - name: LOG_LEVEL
              value: "INFO"
            - name: JAEGER_SAMPLE_RATIO
              value: "0.01"
            - name: MEMC_TIMEOUT
              value: "2"
          ports:
            - containerPort: 5000
          # About 1.1 ms of CPU per hotel search: 200m, at the HPA's 70%, is ~130 RPS per pod, so a
          # burst saturates and throttles one pod before the HPA adds more.
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: hotel-res
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
