spec:
  selector:
    matchLabels:
      app: mongodb-geo
  template:
    metadata:
      labels:
        app: mongodb-geo
    spec:
      containers:
        - name: mongodb
          image: mongo:4.4.6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
          resources:
            requests:
              cpu: 100m
            limits:
              cpu: "1"
          volumeMounts:
            - name: data
              mountPath: /data/db
      # The services seed their collections at startup, so the data needs no volume that outlives the pod.
      volumes:
        - name: data
          emptyDir: {}
