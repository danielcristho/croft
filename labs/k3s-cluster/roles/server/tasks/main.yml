- name: Open the k3s ports
  ansible.builtin.include_tasks: firewall.yml
  vars:
    ufw_action: allow

- name: Write the server config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  notify: Restart k3s

- name: Install k3s
  ansible.builtin.command: "{{ k3s_installer }}"
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: server
  when: k3s_needs_install
  changed_when: true

- name: Keep k3s running
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true

- name: Apply a pending restart
  ansible.builtin.meta: flush_handlers

- name: Wait for the server node
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node/{{ ansible_hostname }} --timeout=10s
  register: node_ready
  until: node_ready.rc == 0
  retries: 36
  delay: 5
  changed_when: false

- name: Read the join token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_token_file
  no_log: true

- name: Share the join token with the agents
  ansible.builtin.set_fact:
    k3s_token: "{{ k3s_token_file.content | b64decode | trim }}"
  no_log: true

- name: Read the admin kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_admin_kubeconfig
  no_log: true

- name: Write the kubeconfig on the controller
  ansible.builtin.copy:
    content: >-
      {{ k3s_admin_kubeconfig.content | b64decode
         | replace('https://127.0.0.1:6443', 'https://' ~ ansible_host ~ ':6443')
         | regex_replace(': default$', ': croft-k3s', multiline=True) }}
    dest: "{{ k3s_kubeconfig }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
