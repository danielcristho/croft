- name: Write the agent config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  notify: Restart k3s-agent
  no_log: true

- name: Install the k3s agent
  ansible.builtin.command: "{{ k3s_installer }}"
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: agent
    K3S_URL: https://{{ k3s_server_ip }}:6443
    K3S_TOKEN: "{{ hostvars[groups['server'][0]].k3s_token }}"
  when: k3s_needs_install
  changed_when: true
  no_log: true

- name: Keep the agent running
  ansible.builtin.systemd:
    name: k3s-agent
    state: started
    enabled: true

- name: Apply a pending restart
  ansible.builtin.meta: flush_handlers

- name: Wait for the agent node
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node/{{ ansible_facts['hostname'] }} --timeout=10s
  delegate_to: "{{ groups['server'][0] }}"
  register: node_ready
  until: node_ready.rc == 0
  retries: 36
  delay: 5
  changed_when: false
