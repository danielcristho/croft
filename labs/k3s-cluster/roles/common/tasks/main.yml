- name: Update inotify limits
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-k8s-inotify.conf
    content: |
      fs.inotify.max_user_instances = {{ inotify_max_user_instances }}
      fs.inotify.max_user_watches = {{ inotify_max_user_watches }}
    mode: "0644"
  notify: Apply inotify limits

- name: Download the k3s installer
  ansible.builtin.get_url:
    url: "{{ k3s_install_url }}"
    dest: "{{ k3s_installer }}"
    mode: "0755"

- name: Read the installed k3s version
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_installed
  changed_when: false
  failed_when: false

- name: Read the k3s systemd unit
  ansible.builtin.slurp:
    src: /etc/systemd/system/{{ k3s_service }}.service
  register: k3s_unit
  failed_when: false

- name: Decide whether k3s needs installing
  ansible.builtin.set_fact:
    k3s_needs_install: >-
      {{ k3s_installed.rc != 0
         or k3s_version not in k3s_installed.stdout
         or "'--" in (k3s_unit.content | default('') | b64decode) }}

- name: Create the k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"
