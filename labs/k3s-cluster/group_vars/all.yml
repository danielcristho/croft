k3s_version: v1.36.4+k3s1
k3s_install_url: https://get.k3s.io
k3s_installer: /usr/local/share/k3s-install.sh
k3s_server_ip: "{{ hostvars[groups['server'][0]].ansible_host }}"
k3s_pod_cidr: 10.42.0.0/16
k3s_service_cidr: 10.43.0.0/16
k3s_disable:
  - traefik
  - servicelb
k3s_kubelet_args:
  - image-gc-high-threshold=95
  - image-gc-low-threshold=90
  - eviction-hard=memory.available<100Mi,nodefs.available<5%,imagefs.available<5%,nodefs.inodesFree<5%,imagefs.inodesFree<5%
  - eviction-minimum-reclaim=nodefs.available=2Gi,imagefs.available=2Gi
k3s_kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/croft-k3s.yaml"

k3s_agent_ports:
  - { port: 6443, proto: tcp, comment: k3s api }
  - { port: 10250, proto: tcp, comment: k3s kubelet }
  - { port: 8472, proto: udp, comment: k3s flannel vxlan }

inotify_max_user_instances: 8192
inotify_max_user_watches: 524288

nvidia_device_plugin_version: v0.20.1
