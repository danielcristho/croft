# Copy to hosts.ini and fill in your hosts. Cluster node names come from each host's hostname.
[server]
server-1 ansible_host=192.0.2.10 ansible_connection=local

[agents]
agent-cpu-1 ansible_host=192.0.2.11
# Ubuntu 26.04 defaults to sudo-rs, whose password prompt ansible cannot read; sudo.ws is the original sudo.
agent-gpu-1 ansible_host=192.0.2.12 ansible_become_exe=sudo.ws

[gpu]
server-1
agent-gpu-1

[k3s:children]
server
agents

[agents:vars]
ansible_user=k3s-admin
